name: Validate CLI and skills
on:
  pull_request:
  push:
    branches: [main, development-cli]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/.go-version
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: go test -race -cover ./...
        working-directory: cli
      - run: go vet ./...
        working-directory: cli
      - run: test -z "$(gofmt -l cli)"
      - run: go run ./tools/buildmeta verify . ../skills/automation-pilot-cli/scripts/bin
        working-directory: cli
      - name: Rebuild and verify reproducibility
        run: |
          python -c 'import json; m=json.load(open("skills/automation-pilot-cli/scripts/bin/build-manifest.json")); print(m["version"].split("+source.")[0])' > /tmp/autopi-version
          cp skills/automation-pilot-cli/scripts/bin/SHA256SUMS /tmp/autopi-checksums
          cli/build.sh "$(cat /tmp/autopi-version)"
          cmp /tmp/autopi-checksums skills/automation-pilot-cli/scripts/bin/SHA256SUMS
      - run: python scripts/validate-content.py
      - run: git diff --check
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Native binary smoke
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) cli="skills/automation-pilot-cli/scripts/bin/windows-amd64/autopi.exe" ;;
            *) cli="skills/automation-pilot-cli/scripts/autopi" ;;
          esac
          "$cli" version
          "$cli" help
          "$cli" lint --help
          "$cli" executions trigger --command-id c:C:1 --print-request
